# Native Codex settings only. Supervisor policy and role selection live in .agents.
# Trusted-project/session/managed settings determine actual effective selection.
model = "gpt-6-astra"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
max_threads = 2
max_depth = 1
