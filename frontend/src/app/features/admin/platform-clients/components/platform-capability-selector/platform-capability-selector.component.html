<div
  class="capability-selector"
  role="group"
  aria-label="Platform client capabilities"
>
  <div class="capability-selector__intro">
    <div class="capability-selector__intro-icon">
      <i class="pi pi-shield"></i>
    </div>

    <div>
      <strong>Access capabilities</strong>

      <span>
        Select only the permissions this client requires.
      </span>
    </div>
  </div>

  <div class="capability-selector__list">
    <article
      *ngFor="
        let item of capabilities();
        trackBy: trackByCapability
      "
      class="capability-card"
      [class.capability-card--selected]="
        isSelected(item.capability)
      "
    >
      <div class="capability-card__header">
        <p-checkbox
          [binary]="true"
          [disabled]="disabled()"
          [ngModel]="isSelected(item.capability)"
          (onChange)="toggle(item, $event.checked)"
          [inputId]="'capability-' + item.capability"
        />

        <label
          class="capability-card__identity"
          [for]="'capability-' + item.capability"
        >
          <strong>
            {{ item.name }}
          </strong>

          <code dir="ltr">
            {{ item.capability }}
          </code>
        </label>

        <p-tag
          class="capability-card__impact"
          [value]="item.impact"
          [severity]="impactSeverity(item.impact)"
        />
      </div>

      <p class="capability-card__description">
        {{ item.description }}
      </p>

      <details class="capability-card__details">
        <summary>
          <span>
            <i class="pi pi-info-circle"></i>
            Access impact
          </span>

          <i class="pi pi-chevron-down"></i>
        </summary>

        <div class="capability-effects">
          <div class="capability-effect capability-effect--grant">
            <span class="capability-effect__label">
              <i class="pi pi-check-circle"></i>
              When enabled
            </span>

            <span>
              {{ item.grantEffect }}
            </span>
          </div>

          <div class="capability-effect capability-effect--revoke">
            <span class="capability-effect__label">
              <i class="pi pi-ban"></i>
              When removed
            </span>

            <span>
              {{ item.revokeEffect }}
            </span>
          </div>
        </div>
      </details>
    </article>
  </div>
</div>
