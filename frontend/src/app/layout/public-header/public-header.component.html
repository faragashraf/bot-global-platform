<header class="public-header">
  <div class="public-header__inner">
    <bgp-brand />

    <button
      class="public-header__mobile-toggle"
      type="button"
      [attr.aria-label]="'nav.toggleNavigation' | translate"
      (click)="toggleMobile()"
    >
      <i class="pi" [class.pi-bars]="!mobileOpen()" [class.pi-times]="mobileOpen()" aria-hidden="true"></i>
    </button>

    <nav class="public-header__nav" [class.public-header__nav--open]="mobileOpen()">
      <a routerLink="/">{{ 'nav.home' | translate }}</a>
      <a routerLink="/apps">{{ 'nav.apps' | translate }}</a>
      <a routerLink="/games">{{ 'nav.games' | translate }}</a>
      <a routerLink="/programs">{{ 'nav.programs' | translate }}</a>
      <a routerLink="/portfolio">{{ 'nav.portfolio' | translate }}</a>
      <a routerLink="/" fragment="about">{{ 'nav.about' | translate }}</a>
      <a routerLink="/" fragment="contact">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="public-header__actions">
      <button
        class="header-action"
        type="button"
        [attr.aria-label]="'designSystem.theme' | translate"
        (click)="toggleTheme()"
      >
        <i class="pi" [class.pi-moon]="theme.resolvedTheme() === 'light'" [class.pi-sun]="theme.resolvedTheme() === 'dark'" aria-hidden="true"></i>
      </button>

      <button
        class="header-action header-action--language"
        type="button"
        [attr.aria-label]="'designSystem.language' | translate"
        (click)="language.setLanguage(language.language() === 'ar' ? 'en' : 'ar')"
      >
        {{ language.language() === 'ar' ? 'EN' : 'AR' }}
      </button>

      <a class="header-login" href="#">{{ 'nav.login' | translate }}</a>
    </div>
  </div>
</header>
