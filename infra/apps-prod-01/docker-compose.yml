services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${BOTGLOBAL_BACKEND_IMAGE:-apps-prod-01-backend}
    build:
      context: ../..
      dockerfile: backend/src/BotGlobal.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DataProtection__ApplicationName: BotGlobal.Platform
      DataProtection__KeysPath: /var/lib/botglobal/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/botglobal-data-protection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?DATA_PROTECTION_CERTIFICATE_PASSWORD is required}
      Database__Provider: PostgreSql
      Database__CanarySchema__EnsureCreated: "true"
      PlatformHttpSecurity__AllowInsecureHttpCookies: "false"
      Frontend__AllowedOrigins__0: https://botglobalservice.com
      Frontend__AllowedOrigins__1: https://www.botglobalservice.com
      Frontend__AllowedOrigins__2: https://faragashraf.github.io
      Notifications__Worker__Enabled: "false"
      Firebase__Enabled: "false"
      Identity__Federated__Google__ServerClientIds__nqrb: 470964330068-4q9469h04hb9e41j0r8ijhfqphpdmc8k.apps.googleusercontent.com
      Identity__Federated__Google__NqrbWebClientId: 235804274047-bb8tmlbfttdm8irq9hl8br4mac1su1pu.apps.googleusercontent.com
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=botglobal_catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=botglobal_identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__Communication: Host=postgres;Port=5432;Database=botglobal_communication;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__PlatformClients: Host=postgres;Port=5432;Database=botglobal_platform_clients;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__Pairing: Host=postgres;Port=5432;Database=botglobal_pairing;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=botglobal_notifications;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__Games: Host=postgres;Port=5432;Database=botglobal_games;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
    volumes:
      - data-protection-keys:/var/lib/botglobal/data-protection-keys
      - ./secrets/data-protection.pfx:/run/secrets/botglobal-data-protection.pfx:ro
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/dist/frontend/browser:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
      reverse_proxy:
        aliases:
          - botglobal-apps-prod-01

volumes:
  postgres-data:
  data-protection-keys:
  caddy-data:
  caddy-config:

networks:
  reverse_proxy:
    external: true
