services:
  coturn:
    image: coturn/coturn:4.17.2-r0
    container_name: lamma-coturn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ${TURN_TLS_DIRECTORY:-/etc/letsencrypt}:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "127.0.0.1", "-p", "3478"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
