services:
  dashboard:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "18081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro

  metrics:
    image: docker:27-cli
    restart: unless-stopped
    command: ["/bin/sh", "/metrics/metrics.sh"]
    volumes:
      - ./metrics:/metrics:ro
      - ./www:/out
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock
